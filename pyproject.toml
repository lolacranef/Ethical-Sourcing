[project]
name = "ethical-sourcing-tracer"
version = "0.1.0"
description = "Evidence-first supply-chain risk exploration MVP"
requires-python = ">=3.11"
dependencies = [
  "anthropic>=0.49,<1",
  "fastapi>=0.115,<1",
  "openpyxl>=3.1,<4",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "pypdf>=5,<7",
  "python-docx>=1.1,<2",
  "python-dotenv>=1,<2",
  "python-multipart>=0.0.20,<1",
  "rapidfuzz>=3.11,<4",
  "sqlalchemy>=2.0,<3",
  "tavily-python>=0.5,<1",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
test = ["httpx>=0.28,<1", "pytest>=8.3,<9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/app"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
